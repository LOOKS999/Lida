name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: cmd
        run: build.bat
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: Lida.exe
          generate_release_notes: true
